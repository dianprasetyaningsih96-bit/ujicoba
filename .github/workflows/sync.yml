name: Sync to aristamartavalutanew

on:
  push:
    branches:
      - main # Ganti dengan 'master' jika branch utama Anda master
  workflow_dispatch:

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo sumber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false # <--- WAJIB: agar Git menggunakan Token Anda, bukan akun bot

      - name: Push perubahan ke repo tujuan
        env:
          TOKEN: ${{ secrets.DEST_REPO_TOKEN }}
        run: |
          git remote add destination https://dianprasetyaningsih96-bit:${TOKEN}@github.com/dianprasetyaningsih96-bit/aristamartavalutanew.git
          git push --force destination "${GITHUB_REF_NAME}"
          git push --tags destination
